<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380">
  <rect width="520" height="380" fill="#d8c7a4"/>
  <rect x="12" y="12" width="496" height="356" fill="none" stroke="#3d433b" stroke-width="6"/>
  <text x="260" y="58" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#2a2e24">FIELD ORDERS</text>
  <text x="40" y="110" font-family="serif" font-size="18" fill="#2a2e24">1. Hold the village square.</text>
  <text x="40" y="150" font-family="serif" font-size="18" fill="#2a2e24">2. No retreat after sundown.</text>
  <text x="40" y="190" font-family="serif" font-size="18" fill="#2a2e24">3. Headshots preferred.</text>
  <text x="40" y="230" font-family="serif" font-size="18" fill="#2a2e24">4. Report all occult activity.</text>
  <text x="40" y="300" font-family="serif" font-size="16" fill="#5a1010">SIGNED — HQ, NORMANDY SECTOR</text>
  <text x="40" y="340" font-family="serif" font-size="14" fill="#2a2e24">ZOMBIE FRONT 1944</text>
</svg>
